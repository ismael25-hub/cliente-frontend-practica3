<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Recursos - Práctica 3</title>
  
  <!-- Chart.js desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }
    
    body {
      background: #f5f5f5;
      padding: 20px;
      color: #333;
    }
    
    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: #0056b3;
      color: white;
      border-radius: 10px;
    }
    
    header h1 {
      font-size: 28px;
    }
    
    header p {
      margin-top: 5px;
      opacity: 0.9;
    }
    
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .card h2 {
      font-size: 18px;
      color: #0056b3;
      margin-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 8px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    
    th {
      background: #f8f9fa;
      color: #666;
      font-weight: 600;
      font-size: 14px;
    }
    
    td {
      font-size: 14px;
    }
    
    tr:hover {
      background: #f9f9f9;
    }
    
    .estado {
      text-align: center;
      padding: 10px;
      color: #888;
      font-style: italic;
    }
    
    canvas {
      max-height: 350px;
    }
    
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>📊 Dashboard de Recursos</h1>
    <p>Práctica 3 Unidad 2 - Consumo de API REST con MongoDB</p>
  </header>

  <div class="container">
    <!-- Tabla de datos -->
    <div class="card">
      <h2>📋 Lista de Recursos</h2>
      <div id="tabla-datos">
        <p class="estado">Cargando datos...</p>
      </div>
    </div>

    <!-- Gráfica -->
    <div class="card">
      <h2>📈 Precios por Recurso</h2>
      <canvas id="miGrafica"></canvas>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
